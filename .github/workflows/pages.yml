name: Deploy the demos to GitHub Pages

# Builds the compact emoji wall at the site root and the Unicode wall under
# unicode/, on every push to main that could change either; also runnable by
# hand from the Actions tab.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - hosts/emoji/**
      - hosts/unicode/**
      - wall/src/**
      - bakery/src/**
      - package-lock.json
      - .github/workflows/pages.yml

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - uses: astral-sh/setup-uv@v7

      - name: Install deps
        run: npm ci

      - name: Build the emoji wall
        run: npm run build -w hosts/emoji

      - name: Write the Unicode feeds as parts
        run: >
          uv run --python 3.12 --with pyarrow --with ./bakery
          python hosts/unicode/make.py --out hosts/unicode/out --parts hosts/emoji/dist/unicode/data

      - name: Build the Unicode wall
        working-directory: hosts/unicode
        env:
          VITE_STATIC: '1'
          UNICODE_BASE: /pezlie/unicode/
        run: npx vite build --outDir ../emoji/dist/unicode --emptyOutDir false

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: hosts/emoji/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
